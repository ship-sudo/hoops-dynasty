<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Hoops Dynasty</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d4762c'/%3E%3Cg stroke='%23140f0a' stroke-width='1.6' fill='none'%3E%3Ccircle cx='16' cy='16' r='14'/%3E%3Cpath d='M2 16h28M16 2v28M6 6c6 4 6 16 0 20M26 6c-6 4-6 16 0 20'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!-- The ground is painted before React mounts, so a light-theme save never flashes dark. -->
    <script>
      ;(() => {
        const saved = localStorage.getItem('hoops.theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.background = theme === 'light' ? '#eae5dc' : '#181715'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
